name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pod lib lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 CocoaPods
        run: gem install cocoapods --no-document

      - name: pod lib lint
        run: pod lib lint LinnoEncrypt.podspec --allow-warnings

  test:
    name: Example 单元测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 CocoaPods
        run: gem install cocoapods --no-document

      - name: pod install
        run: pod install --project-directory=Example

      - name: 解析可用的 iPhone 模拟器
        id: sim
        run: |
          # 同一机型可能在多个 runtime 下重名，直接按 name 指定会产生歧义，
          # 因此这里取第一个可用 iPhone 设备的 UDID 作为 destination。
          UDID=$(xcrun simctl list devices available \
            | grep -E '^ +iPhone ' \
            | head -1 \
            | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "未找到可用的 iPhone 模拟器" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "使用模拟器 UDID：$UDID"

      # 库在 Debug 下用断言中断暴露"漏实现 / 未设置 key"，在 Release 下改为打印错误并返回空。
      # 两种配置的行为不同，因此两个配置都要跑：负向用例在 Debug 下会被 XCTSkip 跳过。
      - name: 运行 Debug 单测
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Example/LinnoEncrypt.xcworkspace \
            -scheme LinnoEncrypt-Example \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -sdk iphonesimulator \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 运行 Release 单测（校验失败路径：断言关闭后应打印错误并返回空）
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Example/LinnoEncrypt.xcworkspace \
            -scheme LinnoEncrypt-Example \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -sdk iphonesimulator \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
